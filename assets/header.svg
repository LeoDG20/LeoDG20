  <text x="145" y="244" fill="#171511" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="70" font-weight="600">De Gobbi</text>

  <text x="145" y="284" fill="#B5720A" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" font-style="italic">Engenharia Elétrica  ·  Dados  ·  Analytics</text>

  <line x1="145" y1="316" x2="820" y2="316" stroke="#B5720A" stroke-width="2"/>
  <text x="145" y="346" fill="#7D7468" font-family="IBM Plex Mono, Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">UFSCAR  /  SÃO CARLOS, SP  /  DISPONÍVEL PARA ESTÁGIO</text>

  <g fill="#B5720A">
    <circle cx="1430" cy="323" r="5"/>
    <circle cx="1450" cy="323" r="3.5" fill-opacity="0.65"/>
