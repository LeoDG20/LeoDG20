<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo De Gobbi — identidade visual</title>
  <desc id="desc">Banner inspirado na identidade visual do portfólio de Leonardo De Gobbi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0B0A"/>
      <stop offset="1" stop-color="#17150F"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#F5F2E8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="20" fill="url(#grid)"/>

  <circle cx="1440" cy="-20" r="270" fill="#F2A93B" fill-opacity="0.06"/>
  <circle cx="1510" cy="80" r="190" fill="#F2A93B" fill-opacity="0.035"/>

  <rect x="84" y="70" width="7" height="280" rx="3.5" fill="#F2A93B" filter="url(#glow)"/>
  <rect x="109" y="70" width="1" height="280" fill="#F5F2E8" fill-opacity="0.13"/>

  <text x="150" y="112" fill="#B5720A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="5">DE GOBBI — LEONARDO</text>

  <text x="150" y="196" fill="#F5F2E8" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600">Engenharia · Dados · Analytics</text>
  <text x="150" y="242" fill="#D8D0BE" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="1.25">Engenharia Elétrica  •  Processos financeiros  •  Machine Learning</text>

  <line x1="150" y1="284" x2="965" y2="284" stroke="#F2A93B" stroke-width="2"/>
  <text x="150" y="322" fill="#A79E8C" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">UFSCAR  /  PORTFÓLIO  /  GITHUB  /  SÃO CARLOS, SP</text>

  <g transform="translate(1370 210)">
    <circle r="104" fill="#F5F0E5"/>
    <text x="0" y="22" text-anchor="middle" fill="#171511" font-family="Georgia, 'Times New Roman', serif" font-size="96" letter-spacing="-8">LG</text>
    <circle cx="70" cy="13" r="6.5" fill="#B5720A"/>
    <rect x="-21" y="45" width="42" height="4" rx="2" fill="#B5720A"/>
  </g>
</svg>
