<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo De Gobbi — GitHub</title>
  <desc id="desc">Cabeçalho editorial inspirado na identidade visual do portfólio de Leonardo De Gobbi.</desc>
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#6F675A" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F7F3EA"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="430" rx="20" fill="url(#paper)"/>
  <rect width="1600" height="430" rx="20" fill="url(#dots)"/>

  <rect x="62" y="56" width="1476" height="318" rx="2" fill="none" stroke="#3B3832" stroke-opacity="0.25" stroke-width="1.5"/>
