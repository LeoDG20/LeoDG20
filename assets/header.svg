<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo De Gobbi — identidade visual</title>
  <desc id="desc">Banner profissional em preto, creme e âmbar para o perfil de Leonardo De Gobbi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0B0A"/>
      <stop offset="1" stop-color="#17150F"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#F5F2E8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="20" fill="url(#grid)"/>

  <circle cx="1370" cy="-10" r="260" fill="#F2A93B" fill-opacity="0.055"/>
  <circle cx="1450" cy="80" r="170" fill="#F2A93B" fill-opacity="0.035"/>

  <rect x="84" y="78" width="8" height="264" rx="4" fill="#F2A93B" filter="url(#glow)"/>
  <rect x="112" y="78" width="1" height="264" fill="#F5F2E8" fill-opacity="0.14"/>

  <text x="150" y="128" fill="#B5720A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="5">LEONARDO DE GOBBI</text>
  <text x="150" y="214" fill="#F5F2E8" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600">Engenharia · Dados · Tecnologia</text>
  <text x="150" y="266" fill="#D8D0BE" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1.5">Engenharia Elétrica  •  Data &amp; Analytics  •  Machine Learning</text>

  <line x1="150" y1="304" x2="760" y2="304" stroke="#F2A93B" stroke-width="2"/>
  <text x="150" y="338" fill="#A79E8C" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">UFSCar  /  PORTFÓLIO  /  GITHUB</text>

  <g transform="translate(1190 214)">
    <circle r="112" fill="#F5F0E5"/>
    <text x="0" y="28" text-anchor="middle" fill="#171511" font-family="Georgia, 'Times New Roman', serif" font-size="108">LG</text>
    <circle cx="77" cy="16" r="7" fill="#B5720A"/>
    <rect x="-22" y="50" width="44" height="4" rx="2" fill="#B5720A"/>
  </g>
</svg>
